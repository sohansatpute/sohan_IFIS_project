AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Reusable AWS Backup configuration for the IFIS project.
  Creates a backup vault, backup plan, and backup selection
  for the EC2 instance created by the compute stack.

Parameters:

  ComputeStackName:
    Type: String
    Default: IFIS-POC-compute
    Description: Name of the CloudFormation stack that creates the EC2 instance.

  BackupScheduleCron:
    Type: String
    Default: 'cron(0 15 ? * SUN *)'
    Description: >
      Weekly backup schedule in UTC.
      15:00 UTC Sunday = 00:00 Monday JST.

  RetentionDays:
    Type: Number
    Default: 30
    Description: Number of days to retain recovery points.

  StartWindowMinutes:
    Type: Number
    Default: 60
    Description: Backup job start window in minutes.

  CompletionWindowMinutes:
    Type: Number
    Default: 180
    Description: Backup job completion window in minutes.

  ProjectName:
    Type: String
    Default: IFIS

  Environment:
    Type: String
    Default: POC

  Owner:
    Type: String
    Default: Sohan

Resources:

  BackupVault:
    Type: AWS::Backup::BackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BackupVaultName: !Sub '${ProjectName}-${Environment}-backup-vault'

      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Owner: !Ref Owner


  BackupRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-AWSBackupRole'

      AssumeRolePolicyDocument:
        Version: '2012-10-17'

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - backup.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment

        - Key: Owner
          Value: !Ref Owner


  BackupPlan:
    Type: AWS::Backup::BackupPlan

    Properties:

      BackupPlan:

        BackupPlanName: !Sub '${ProjectName}-${Environment}-backup-plan'

        BackupPlanRule:

          - RuleName: WeeklyEC2Backup

            TargetBackupVault: !Ref BackupVault

            ScheduleExpression: !Ref BackupScheduleCron

            StartWindowMinutes: !Ref StartWindowMinutes

            CompletionWindowMinutes: !Ref CompletionWindowMinutes

            Lifecycle:
              DeleteAfterDays: !Ref RetentionDays


  BackupSelection:
    Type: AWS::Backup::BackupSelection

    Properties:

      BackupPlanId: !Ref BackupPlan

      BackupSelection:
        SelectionName: !Sub '${ProjectName}-${Environment}-ec2-selection'

        IamRoleArn: !GetAtt BackupRole.Arn

        Resources:
          - Fn::ImportValue:
              !Sub '${ComputeStackName}-Ec2Arn'


Outputs:

  BackupVaultName:
    Description: AWS Backup vault name
    Value: !Ref BackupVault

  BackupPlanId:
    Description: AWS Backup plan ID
    Value: !Ref BackupPlan

  BackupRoleArn:
    Description: IAM role used by AWS Backup
    Value: !GetAtt BackupRole.Arn