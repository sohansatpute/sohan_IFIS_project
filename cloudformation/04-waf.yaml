AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Reusable AWS WAFv2 Web ACL for CloudFront.
  Protects CloudFront distributions using AWS Managed Rules.

Parameters:

  ProjectName:
    Type: String
    Default: IFIS

  Environment:
    Type: String
    Default: POC

  Owner:
    Type: String
    Default: Sohan

Resources:

  WebACL:
    Type: AWS::WAFv2::WebACL

    Properties:
      Name: !Sub '${ProjectName}-${Environment}-cloudfront-waf'

      Description: IFIS POC CloudFront WAF 
      Scope: CLOUDFRONT

      DefaultAction:
        Allow: {}

      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${Environment}-cloudfront-waf'

      Rules:

        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1

          OverrideAction:
            None: {}

          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet

          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSet

        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2

          OverrideAction:
            None: {}

          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet

          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesKnownBadInputsRuleSet

        - Name: AWSManagedRulesLinuxRuleSet
          Priority: 3

          OverrideAction:
            None: {}

          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesLinuxRuleSet

          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesLinuxRuleSet

        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 4

          OverrideAction:
            None: {}

          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet

          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesSQLiRuleSet

        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 5

          OverrideAction:
            None: {}

          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList

          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesAmazonIpReputationList

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment

        - Key: Owner
          Value: !Ref Owner

Outputs:

  WebAclArn:
    Description: ARN of the CloudFront WAF Web ACL
    Value: !GetAtt WebACL.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-WebAclArn'

  WebAclId:
    Description: ID of the CloudFront WAF Web ACL
    Value: !GetAtt WebACL.Id
    Export:
      Name: !Sub '${ProjectName}-${Environment}-WebAclId'

  WebAclName:
    Description: Name of the CloudFront WAF Web ACL
    Value: !Ref WebACL
    Export:
      Name: !Sub '${ProjectName}-${Environment}-WebAclName'